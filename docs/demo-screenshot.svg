<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Blockchain visualization demo preview</title>
  <desc id="desc">Preview of the React blockchain interface with the navigation bar, blockchain visualization, UTXO pool, and identities panel.</desc>
  <rect width="1200" height="620" fill="#f5f7fa"/>
  <rect width="1200" height="62" fill="#293742"/>
