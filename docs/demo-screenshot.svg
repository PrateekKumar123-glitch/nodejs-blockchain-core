  <text x="925" y="36" fill="#c9d2d9" font-family="Arial, sans-serif" font-size="14">Pick a blockchain or</text>
  <rect x="1050" y="17" width="120" height="30" rx="3" fill="#ffffff"/>
  <text x="1062" y="37" fill="#53616b" font-family="Arial, sans-serif" font-size="13">Bitcoin</text>
  <text x="36" y="105" fill="#26343d" font-family="Arial, sans-serif" font-size="25" font-weight="700">Blockchain Visualization</text>
  <rect x="36" y="130" width="700" height="420" fill="#ffffff" stroke="#d4dce1"/>
  <rect x="78" y="205" width="270" height="110" rx="4" fill="#e9f2f7" stroke="#6b8797" stroke-width="2"/>
